version: '3.9'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: stock_tracker_db
    ports:
      - "8123:8123" # HTTP port (for API/UI)
      - "9000:9000" # Native port (for Python client)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=stock_tracker
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=secretpassword
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    restart: always

volumes:
  clickhouse_data:
    # Optional: Web UI for ClickHouse (if not using DBeaver)
    # clickhouse-ui:
    #   image: spoonest/clickhouse-tabix-web-client
    #   ports:
    #     - "8080:80"
    #   depends_on:
    #     - clickhouse
